<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3557">
<meta name="robots" content="noindex">
<title>שלט הבית</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef3f9; --bg2: #e3ebf5; --card: #ffffff; --ink: #14213d; --ink2: #5b6b85; --line: #d8e1ee;
  --brand: #1d3557; --accent: #f4a261; --ok: #2a9d8f; --warn: #e9c46a; --bad: #e63946;
  --shadow: 0 1px 2px rgba(20,33,61,.06), 0 6px 20px rgba(20,33,61,.07);
  --r: 18px; --tv: #1d3557;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1626; --bg2: #152036; --card: #182540; --ink: #edf2fa; --ink2: #93a4c1; --line: #24344f;
    --brand: #8fb3ff; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --bg: #0e1626; --bg2: #152036; --card: #182540; --ink: #edf2fa; --ink2: #93a4c1; --line: #24344f;
  --brand: #8fb3ff; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 Rubik, system-ui, sans-serif; }
body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: "Secular One", Rubik, sans-serif; font-weight: 400; margin: 0; }
.hide { display: none !important; }

/* ---------- top bar + tabs */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.bar { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 16px 6px; }
.bar h1 { font-size: 24px; flex: 1; display: flex; align-items: center; gap: 8px; }
.bar h1 span.house { font-size: 26px; }
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); }
.me img { width: 30px; height: 30px; border-radius: 50%; }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow); font-size: 16px; }
.tabs { max-width: 1100px; margin: 0 auto; display: flex; gap: 6px; padding: 6px 16px 10px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; display: flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-weight: 500; font-size: 15px; white-space: nowrap; }
.tab .em { font-size: 18px; }
.tab[aria-selected="true"] { background: var(--brand); color: #fff; }
:root[data-theme="dark"] .tab[aria-selected="true"], .dark .tab[aria-selected="true"] { color: #0e1626; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa7bd; flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.dot.idle { background: var(--warn); }

main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }
.section { margin-top: 22px; }
.section > h2 { font-size: 19px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.hint { color: var(--ink2); font-size: 14px; }

/* ---------- cards */
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.grid { display: grid; gap: 12px; }
.tvs { grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }

.tvcard { position: relative; overflow: hidden; border-top: 5px solid var(--tv); }
.tvhead { display: flex; align-items: center; gap: 12px; }
.tvicon { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; background: color-mix(in srgb, var(--tv) 16%, var(--card)); flex: none; }
.tvname { font-family: "Secular One", Rubik; font-size: 21px; line-height: 1.1; }
.state { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink2); margin-top: 3px; }
.playing { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: var(--bg2); font-size: 15px; min-height: 52px; }
.playing img { width: 32px; height: 32px; border-radius: 8px; }
.playing b { font-weight: 600; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pill { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--bg2); color: var(--ink2); }
.pill.lock { background: color-mix(in srgb, var(--bad) 15%, var(--card)); color: var(--bad); font-weight: 600; }
.pill.moon { background: color-mix(in srgb, #7b61ff 15%, var(--card)); color: #7b61ff; font-weight: 600; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }

/* action tiles */
.act { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 12px 6px; min-height: 78px; border-radius: 14px; background: var(--bg2); font-size: 13px; font-weight: 500; text-align: center; transition: transform .12s, background .12s; }
.act .ic { font-size: 26px; line-height: 1; }
.act:hover { background: color-mix(in srgb, var(--tv) 14%, var(--bg2)); }
.act:active { transform: scale(.95); }
.act[disabled] { opacity: .4; pointer-events: none; }
.act.on { background: var(--tv); color: #fff; }
.acts { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }

/* tv hero */
.hero { display: grid; gap: 16px; grid-template-columns: 1fr; border-top: 6px solid var(--tv); }
@media (min-width: 760px) { .hero { grid-template-columns: 1.1fr 1fr; align-items: center; } }
.hero .tvicon { width: 72px; height: 72px; font-size: 42px; border-radius: 22px; }
.hero .tvname { font-size: 30px; }
.vol { display: flex; align-items: center; gap: 12px; }
.vol input { flex: 1; accent-color: var(--tv); height: 28px; }
.vol .num { min-width: 34px; text-align: center; font-weight: 600; }

.apps { grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); }
.app { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 14px; font-size: 12.5px; text-align: center; line-height: 1.2; }
.app:hover { background: var(--bg2); }
.app img, .app .ph { width: 48px; height: 48px; border-radius: 12px; background: var(--bg2); display: grid; place-items: center; font-size: 22px; }

.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 14px; color: var(--ink2); }
.field input, .field select, .field textarea, .inp { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--ink); width: 100%; }
textarea.inp { resize: vertical; min-height: 84px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 12px; background: var(--brand); color: #fff; font-weight: 600; }
:root[data-theme="dark"] .btn, .dark .btn { color: #0e1626; }
.btn.ghost { background: var(--bg2); color: var(--ink); }
.btn.big { width: 100%; padding: 14px; font-size: 17px; }
.btn.red { background: var(--bad); color: #fff; }
.switch { position: relative; width: 50px; height: 28px; flex: none; }
.switch input { opacity: 0; position: absolute; inset: 0; cursor: pointer; z-index: 1; margin: 0; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch input:checked + span { background: var(--tv); }
.switch input:checked + span::after { right: 25px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
.toggle-row + .toggle-row { border-top: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 13px; border-radius: 999px; background: var(--bg2); font-size: 14px; border: 1px solid transparent; }
.chip[aria-pressed="true"] { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 12%, var(--card)); font-weight: 600; }
.emojis { display: flex; flex-wrap: wrap; gap: 4px; }
.emojis button { width: 40px; height: 40px; border-radius: 10px; font-size: 22px; }
.emojis button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 30%, var(--card)); }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 14px; text-align: center; color: var(--ink2); cursor: pointer; display: block; }
.drop img { max-width: 100%; max-height: 200px; border-radius: 10px; display: block; margin: 0 auto; }

.log { display: flex; flex-direction: column; gap: 8px; }
.logitem { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--bg2); font-size: 14px; }
.logitem .t { color: var(--ink2); font-size: 12px; white-space: nowrap; margin-inline-start: auto; }
.notes { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.note { padding: 14px; border-radius: 14px; background: #fff6bf; color: #3b3200; box-shadow: var(--shadow); transform: rotate(-.6deg); }
.note:nth-child(2n) { transform: rotate(.7deg); background: #d9f2ff; color: #06324a; }
.note:nth-child(3n) { background: #ffe0ec; color: #4a0626; }
.note img { width: 100%; border-radius: 8px; margin-top: 8px; }
.note b { display: block; font-size: 16px; }

/* login */
.login { min-height: 80vh; display: grid; place-items: center; text-align: center; }
.login .card { max-width: 380px; padding: 34px 26px; }
.login .house { font-size: 64px; }
.login h1 { font-size: 34px; margin: 6px 0 4px; }

/* sheet (modal) */
.scrim { position: fixed; inset: 0; background: rgba(10,18,35,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 700px) { .scrim { align-items: center; } }
.sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 20px 18px 26px; box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
@media (min-width: 700px) { .sheet { border-radius: 24px; } }
.sheet h2 { font-size: 22px; margin-bottom: 14px; }
.sheet .stack > * + * { margin-top: 14px; }

.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 12px; z-index: 60; font-weight: 500; box-shadow: var(--shadow); max-width: 90vw; }
.empty { text-align: center; padding: 34px 16px; color: var(--ink2); }
.empty .big { font-size: 44px; }
@media (max-width: 420px) { .bar h1 { font-size: 21px; } .me span { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"><div class="login"><div class="hint">טוען…</div></div></div>
<div id="modal"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, set, update, push, serverTimestamp, query, limitToLast, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ===== settings
const firebaseConfig = {
  apiKey: "AIzaSyDcjwvz5YKdA5i6sUXwpMOFdqLQXkMVFQs",
  authDomain: "edery-home-tv.firebaseapp.com",
  databaseURL: "https://edery-home-tv-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "edery-home-tv",
  appId: "1:286548310974:web:b64108fa2a498137de97ef",
};
const SHEET_ID = "1XcCPVyQeO_gKXu6rEXNNPt1T9LfiOMqXJ3457ogLHZA";   // the living-room notes sheet
const TEMPLATES = [
  { emoji: "🍝", text: "ארוחת ערב מוכנה! כולם למטה" },
  { emoji: "🌙", text: "זמן לישון, לילה טוב" },
  { emoji: "🙋", text: "תרדו רגע למטה בבקשה" },
  { emoji: "📚", text: "שיעורי בית קודם, אחר כך טלוויזיה" },
  { emoji: "🚗", text: "יוצאים בעוד 10 דקות, להתארגן" },
  { emoji: "❤️", text: "אוהבים אתכם" },
];
const EMOJIS = ["📢","🍝","🌙","❤️","🎉","⚽","🙋","📚","🚗","🎂","⭐","😴","🛁","🦷","☀️","🏠"];
const TV_ICONS = ["🛋️","🌙","⚽","📺","🎮","🧸","🌈","🦄","🍿","🏠"];
const TV_COLORS = ["#2f6fed","#9b5de5","#f5b700","#e63946","#2a9d8f","#f4845f","#1d3557"];
const ONLINE_MS = 150_000;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let user = null, tvs = {}, logItems = [], current = localStorage.getItem("tab") || "home";
const unsub = [];
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ===== theme (system / light / dark)
function applyTheme() {
  const t = localStorage.getItem("theme");
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.body.classList.toggle("dark", dark);
}
try { applyTheme(); } catch {}

// ===== auth
onAuthStateChanged(auth, u => {
  user = u;
  unsub.splice(0).forEach(f => f());
  if (!u) return renderLogin();
  unsub.push(onValue(ref(db, "tvs"), s => { tvs = s.val() || {}; render(); },
    err => { renderLogin("אין לחשבון הזה הרשאה לשלט הבית (" + esc(u.email) + ")"); }));
  unsub.push(onValue(query(ref(db, "log"), limitToLast(40)), s => {
    logItems = Object.entries(s.val() || {}).map(([k, v]) => ({ k, ...v })).reverse();
    if (current === "messages") render();
  }));
});

function renderLogin(err) {
  $("#app").innerHTML = `
    <div class="login"><div class="card">
      <div class="house">🏠</div>
      <h1>שלט הבית</h1>
      <p class="hint">כל הטלוויזיות של הבית, מכל מקום</p>
      ${err ? `<p style="color:var(--bad)">${err}</p>` : ""}
      <button class="btn big" id="login">כניסה עם Google</button>
      ${user ? `<p><button class="btn ghost" id="logout">החלפת חשבון</button></p>` : ""}
    </div></div>`;
  $("#login").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => toast("הכניסה נכשלה: " + e.code));
  const lo = $("#logout"); if (lo) lo.onclick = () => signOut(auth);
}

// ===== helpers on TV data
const approved = () => Object.entries(tvs).filter(([, t]) => t.meta?.approved)
  .sort((a, b) => (a[1].meta.order ?? 9) - (b[1].meta.order ?? 9));
const pending = () => Object.entries(tvs).filter(([, t]) => !t.meta?.approved && t.info);
function stateOf(t) {
  const s = t.status || {};
  const online = s.lastSeen && Date.now() - s.lastSeen < ONLINE_MS;
  if (!online) return { cls: "", text: "כבויה / לא מחוברת", online: false };
  if (!s.screenOn) return { cls: "idle", text: "מחוברת, מסך כבוי", online: true };
  return { cls: "on", text: "דולקת", online: true };
}
const iconOf = (t, pkg) => { const b = pkg && t.icons?.[pkg.replaceAll(".", "_")]; return b ? `data:image/png;base64,${b}` : ""; };
function ago(ts) {
  if (!ts) return "";
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "עכשיו"; if (m < 60) return `לפני ${m} דק׳`;
  const h = Math.round(m / 60); if (h < 24) return `לפני ${h} שע׳`;
  return new Date(ts).toLocaleDateString("he-IL");
}
const tvColor = t => t.meta?.color || "#1d3557";
const tvName = t => t.meta?.name || t.info?.model || "טלוויזיה";
const tvIcon = t => t.meta?.icon || "📺";

// ===== commands
async function cmd(uid, type, args = {}, quiet) {
  const id = push(ref(db, "ids")).key;
  await set(ref(db, `tvs/${uid}/in/cmd`), { id, type, ...args, ts: Date.now() });
  if (!quiet) waitAck(uid, id, type);
}
function waitAck(uid, id, type) {
  let done = false;
  const off = onValue(ref(db, `tvs/${uid}/ack`), s => {
    const a = s.val();
    if (a?.id !== id) return;
    done = true; off();
    toast(a.ok ? `✓ ${tvName(tvs[uid])}: בוצע` : `✗ ${tvName(tvs[uid])}: ${a.error}`);
  });
  setTimeout(() => { if (!done) { off(); toast(`⏳ ${tvName(tvs[uid])} לא ענתה. אולי היא כבויה?`); } }, 15000);
}
const setConfig = (uid, path, value) => set(ref(db, `tvs/${uid}/in/config/${path}`), value);
const log = (entry) => push(ref(db, "log"), { at: serverTimestamp(), by: user.displayName || user.email, ...entry });

// ===== render
function render() {
  if (!user) return;
  const list = approved();
  if (current !== "home" && current !== "messages" && current !== "notes" && !tvs[current]) current = "home";
  const tab = (id, em, label, dot) => `<button class="tab" role="tab" aria-selected="${current === id}" data-tab="${id}">${dot ?? ""}<span class="em">${em}</span>${esc(label)}</button>`;
  $("#app").innerHTML = `
    <header class="top">
      <div class="bar">
        <h1><span class="house">🏠</span>שלט הבית</h1>
        <div class="me">${user.photoURL ? `<img src="${esc(user.photoURL)}" alt="">` : ""}<span>${esc(user.displayName || "")}</span></div>
        <button class="iconbtn" id="theme" title="מצב תצוגה" aria-label="מצב תצוגה">🌓</button>
        <button class="iconbtn" id="logout" title="יציאה" aria-label="יציאה">⎋</button>
      </div>
      <nav class="tabs" role="tablist">
        ${tab("home", "🏡", "כל הבית")}
        ${list.map(([uid, t]) => tab(uid, tvIcon(t), tvName(t), `<span class="dot ${stateOf(t).cls}"></span>`)).join("")}
        ${tab("messages", "💬", "הודעות")}
        ${tab("notes", "📝", "פתקים")}
      </nav>
    </header>
    <main id="view">${current === "home" ? viewHome() : current === "messages" ? viewMessages() : current === "notes" ? viewNotes() : viewTv(current)}</main>`;
  $("#logout").onclick = () => signOut(auth);
  $("#theme").onclick = () => {
    const order = [null, "light", "dark"], now = localStorage.getItem("theme");
    const next = order[(order.indexOf(now) + 1) % 3];
    next ? localStorage.setItem("theme", next) : localStorage.removeItem("theme");
    applyTheme(); toast(next === "light" ? "☀️ בהיר" : next === "dark" ? "🌙 כהה" : "🌓 לפי המכשיר");
  };
  if (current === "notes") loadNotes();
}

function tvCard(uid, t) {
  const st = stateOf(t), s = t.status || {};
  const icon = iconOf(t, s.app);
  return `
  <article class="card tvcard" style="--tv:${tvColor(t)}">
    <div class="tvhead">
      <div class="tvicon">${tvIcon(t)}</div>
      <div style="flex:1">
        <div class="tvname">${esc(tvName(t))}</div>
        <div class="state"><span class="dot ${st.cls}"></span>${st.text}${!st.online && s.lastSeen ? ` · נראתה ${ago(s.lastSeen)}` : ""}</div>
      </div>
      <button class="iconbtn" data-tab="${uid}" aria-label="פתח">‹</button>
    </div>
    <div class="playing">${st.online && s.screenOn && s.app
      ? `${icon ? `<img src="${icon}" alt="">` : "▶️"}<span>עכשיו: <b>${esc(s.appLabel || s.app)}</b></span>`
      : `<span class="hint">${st.online ? "לא מנגנת כלום" : "—"}</span>`}</div>
    <div class="pills">
      ${s.locked ? `<span class="pill lock">🔒 נעולה</span>` : ""}
      ${s.bedtimeNow ? `<span class="pill moon">🌙 שעת שינה</span>` : ""}
      ${t.in?.config?.bedtime?.on && !s.bedtimeNow ? `<span class="pill">🌙 שינה ב-${esc(t.in.config.bedtime.from)}</span>` : ""}

// ===== sheet notes preview (same CSV the TV reads)
function parseCsv(t) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; } else if (c !== "\r") f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}
async function loadNotes() {
  const box = $("#notesList"); if (!box) return;
  try {
    const csv = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&t=${Date.now()}`).then(r => r.text());
    const rows = parseCsv(csv).slice(1).filter(r => (r[1] || r[2] || "").trim());
    if (!rows.length) { box.innerHTML = `<div class="hint">אין פתקים בגיליון</div>`; return; }
    box.innerHTML = rows.map(r => `<div class="note"><b>${esc(r[0])} ${esc(r[1])}</b>${esc(r[2])}
      ${r[5] || r[6] ? `<div class="hint" style="color:inherit;opacity:.7;font-size:12px">${esc(r[5])}${r[6] ? " – " + esc(r[6]) : ""}</div>` : ""}
      <div data-img="${esc((r[3] || "").trim())}"></div></div>`).join("");
    box.querySelectorAll("[data-img]").forEach(async el => {
      const v = el.dataset.img; if (!v) return;
      const src = v.startsWith("img:") ? await imageData(v.slice(4)) : /^https?:/.test(v) && !/photos\.app\.goo\.gl|photos\.google/.test(v) ? v : "";
      if (src) el.innerHTML = `<img src="${esc(src)}" alt="">`; else el.innerHTML = `<div class="hint" style="color:inherit">🖼️ תמונה</div>`;
    });
  } catch { box.innerHTML = `<div class="hint">לא הצלחתי לקרוא את הגיליון</div>`; }
}

// ===== images: shrink in the browser, store in the database
function shrink(file, max = 1100, q = .78) {
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      ok(c.toDataURL("image/jpeg", q));
    };
    img.onerror = bad;
    img.src = URL.createObjectURL(file);
  });
}
async function uploadImage(dataUrl) {
  const r = push(ref(db, "images"));
  await set(r, { data: dataUrl, at: serverTimestamp() });
  return r.key;
}

    <div class="field">אייקון<div class="emojis" id="aicon">${TV_ICONS.map(e => `<button data-e="${e}" aria-pressed="${e === icon}">${e}</button>`).join("")}</div></div>
    <div class="field">צבע<div class="chips" id="acolor">${TV_COLORS.map(c => `<button class="chip" data-c="${c}" aria-pressed="${c === color}" style="background:${c};width:36px;height:36px;padding:0" aria-label="צבע"></button>`).join("")}</div></div>
    <div class="row"><button class="btn big" id="aok" style="flex:1">הוסף לשלט</button><button class="btn ghost" id="aclose">ביטול</button></div>
  </div></div></div>`;
  const close = () => m.innerHTML = "";
  $("#aclose").onclick = close;
  $("#aicon").onclick = e => { const b = e.target.closest("[data-e]"); if (!b) return; icon = b.dataset.e; $("#aicon").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
  $("#acolor").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; color = b.dataset.c; $("#acolor").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
  $("#aok").onclick = async () => {
    const name = $("#aname").value.trim(); if (!name) return toast("תן לה שם");
    await set(ref(db, `tvs/${uid}/meta`), { approved: true, name, icon, color, order: approved().length });
    close(); toast("✓ " + name + " נוספה");
  };
  setTimeout(() => $("#aname").focus(), 50);
}

function askUrl(uid) {
  const m = $("#modal");
  m.innerHTML = `<div class="scrim" id="scrim"><div class="sheet"><div class="stack">
    <h2>🌐 פתח אתר בטלוויזיה</h2>
    <div class="chips">${[["ONE", "https://www.one.co.il/"], ["ספורט 5", "https://www.sport5.co.il/"], ["ynet", "https://www.ynet.co.il/"], ["N12", "https://www.mako.co.il/news"]]
      .map(([n, u]) => `<button class="chip" data-u="${u}">${n}</button>`).join("")}</div>
    <input class="inp" id="uurl" placeholder="https://" style="direction:ltr" inputmode="url">
    <div class="row"><button class="btn big" id="uok" style="flex:1">פתח</button><button class="btn ghost" id="uclose">ביטול</button></div>
  </div></div></div>`;
  const close = () => m.innerHTML = "";
  $("#uclose").onclick = close;
  m.querySelectorAll("[data-u]").forEach(b => b.onclick = () => $("#uurl").value = b.dataset.u);
  $("#uok").onclick = () => { let u = $("#uurl").value.trim(); if (!u) return; if (!/^https?:\/\//.test(u)) u = "https://" + u; cmd(uid, "url", { url: u }); close(); };
}

// ===== one delegated click handler for everything
document.addEventListener("click", async e => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn && !e.target.closest("#modal")) { current = tabBtn.dataset.tab; localStorage.setItem("tab", current); render(); scrollTo({ top: 0 }); return; }
  const b = e.target.closest("[data-do]"); if (!b || b.disabled) return;
  const uid = b.dataset.uid, t = tvs[uid], d = b.dataset.do;
  switch (d) {
    case "msg": return openComposer(uid);
    case "tmpl": return openComposer("*", TEMPLATES[+b.dataset.i]);
    case "quick": {
      const m = TEMPLATES[+b.dataset.i], list = approved();
      await Promise.all(list.map(([u]) => cmd(u, "message", { ...m, seconds: 30, sound: true, from: user.displayName?.split(" ")[0] || "" }, true)));
      log({ type: "message", ...m, to: "כל הבית" }); return toast("📢 נשלח לכל הבית");
    }
    case "lock": {
      const on = !t.in?.config?.lock?.on;
      await setConfig(uid, "lock/on", on); if (on && !t.in?.config?.lock?.text) await setConfig(uid, "lock/text", "המסך נעול 🔒");
      log({ type: "lock", emoji: on ? "🔒" : "🔓", text: on ? "נעילה" : "שחרור נעילה", to: tvName(t) });
      return toast(on ? `🔒 ${tvName(t)} ננעלה` : `🔓 ${tvName(t)} שוחררה`);
    }
    case "lockall": case "unlockall": {
      const on = d === "lockall";
      await Promise.all(approved().map(([u]) => setConfig(u, "lock/on", on)));
      log({ type: "lock", emoji: on ? "🔒" : "🔓", text: on ? "נעילת כל הבית" : "שחרור כל הבית", to: "כל הבית" });
      return toast(on ? "🔒 כל הטלוויזיות ננעלו" : "🔓 כל הטלוויזיות שוחררו");
    }
    case "mute": return cmd(uid, "mute", { on: !t.status?.muted });
    case "home": case "pause": case "play": case "screenOff": case "screenOn": case "refresh": return cmd(uid, d);
    case "open": return cmd(uid, "open", { pkg: b.dataset.pkg });
    case "hdmi": return cmd(uid, "hdmi", { input: b.dataset.input });
    case "url": return askUrl(uid);
    case "skip": {
      const min = +b.dataset.min;
      await setConfig(uid, "bedtime/skipUntil", min ? Date.now() + min * 60000 : 0);
      if (min) log({ type: "bedtime", emoji: "⏰", text: `שעת שינה נדחתה ב-${min} דק׳`, to: tvName(t) });
      return toast(min ? `⏰ פתוח לעוד ${min} דקות` : "ההארכה בוטלה");
    }
    case "meta": await update(ref(db, `tvs/${uid}/meta`), { [b.dataset.k]: b.dataset.v }); return;
    case "approve": return openApprove(uid);
    case "reject": if (await ask("למחוק את הטלוויזיה הזו מהרשימה?", "מחק")) await remove(ref(db, `tvs/${uid}`)); return;
    case "forget":
      if (await ask(`להסיר את "${tvName(t)}" מהשלט? היא תחזור לרשימת האישור אם האפליקציה עדיין מותקנת.`, "הסר")) { await remove(ref(db, `tvs/${uid}/meta`)); current = "home"; render(); }
      return;
    case "notesreload": return loadNotes();
  }
});

// switches + text fields (config) — saved on change
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.cfg) {
    const uid = el.dataset.uid, t = tvs[uid];
    await setConfig(uid, `${el.dataset.cfg}/on`, el.checked);
    if (el.dataset.cfg === "bedtime" && el.checked && !t.in?.config?.bedtime?.from)
      await update(ref(db, `tvs/${uid}/in/config/bedtime`), { from: "21:00", to: "07:00" });
    log({ type: el.dataset.cfg, emoji: el.dataset.cfg === "lock" ? (el.checked ? "🔒" : "🔓") : "🌙",
      text: el.dataset.cfg === "lock" ? (el.checked ? "נעילה" : "שחרור נעילה") : (el.checked ? "שעת שינה הופעלה" : "שעת שינה כובתה"), to: tvName(t) });
    return toast("✓ נשמר");
  }
  if (el.dataset.cfgtext) { await setConfig(el.dataset.uid, el.dataset.cfgtext, el.value); return toast("✓ נשמר"); }
  if (el.dataset.meta) { await update(ref(db, `tvs/${el.dataset.uid}/meta`), { [el.dataset.meta]: el.value.trim() }); return toast("✓ נשמר"); }
  if (el.id === "noteFile" && el.files[0]) {
    $("#notePrev").textContent = "מעלה…";
    const data = await shrink(el.files[0], 1100, .78);
    const key = await uploadImage(data);
    $("#notePrev").innerHTML = `<img src="${data}" alt="">`;
    $("#noteOut").classList.remove("hide");
    $("#noteCode").value = "img:" + key;
    $("#copyCode").onclick = () => navigator.clipboard.writeText("img:" + key).then(() => toast("📋 הועתק. הדבק בגיליון"));
  }
});

// volume slider: send when the finger lifts
document.addEventListener("input", e => { if (e.target.id === "vol") $("#volnum").textContent = e.target.value; });
document.addEventListener("change", e => { if (e.target.id === "vol") cmd(current, "volume", { level: +e.target.value }); });

/** In-page yes/no sheet (browser confirm() dialogs look bad and block the page). */
function ask(text, yes) {
  return new Promise(ok => {
    const m = $("#modal");
    m.innerHTML = `<div class="scrim" id="scrim"><div class="sheet"><div class="stack">
      <h2>${esc(text)}</h2>
      <div class="row"><button class="btn red big" id="qyes" style="flex:1">${esc(yes)}</button><button class="btn ghost" id="qno">ביטול</button></div>
    </div></div></div>`;
    const done = v => { m.innerHTML = ""; ok(v); };
    $("#qyes").onclick = () => done(true);
    $("#qno").onclick = () => done(false);
    $("#scrim").onclick = e => { if (e.target.id === "scrim") done(false); };
  });
}

let toastTimer;
function toast(text) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div"); el.className = "toast"; el.textContent = text; el.setAttribute("role", "status");
  document.body.appendChild(el); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 3200);
}
// refresh "x minutes ago" and online dots
setInterval(() => { if (user && !$("#modal").innerHTML && !document.activeElement?.matches("input,textarea,select")) render(); }, 30000);
</script>
</body>
