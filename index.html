<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151c">
<meta name="robots" content="noindex">
<title>שלט הבית</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens: dark is the base, light overrides */
:root {
  color-scheme: dark;
  --bg: #10151c; --s1: #171d26; --s2: #1e2632; --s3: #273140; --line: #2a3442;
  --text: #e8edf3; --muted: #8b97a6; --faint: #66727f;
  --accent: #f2a93b; --on-accent: #1b1305; --accent-fg: #f2a93b; --accent-soft: rgba(242,169,59,.14);
  --ok: #3fcf8e; --idle: #f2a93b; --off: #5b6676; --danger: #f0675c;
  --r: 14px; --r-sm: 10px;
  --pop: 0 24px 64px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f4f5f7; --s1: #ffffff; --s2: #f1f3f6; --s3: #e6e9ee; --line: #e1e5eb;
    --text: #131920; --muted: #5d6977; --faint: #8a94a1;
    --accent-fg: #a4620a; --accent-soft: rgba(242,169,59,.18);
    --ok: #1f9d63; --idle: #d68a12; --off: #a3acb8; --danger: #d4473c;
    --pop: 0 24px 64px rgba(15,23,42,.18);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f5f7; --s1: #ffffff; --s2: #f1f3f6; --s3: #e6e9ee; --line: #e1e5eb;
  --text: #131920; --muted: #5d6977; --faint: #8a94a1;
  --accent-fg: #a4620a; --accent-soft: rgba(242,169,59,.18);
  --ok: #1f9d63; --idle: #d68a12; --off: #a3acb8; --danger: #d4473c;
  --pop: 0 24px 64px rgba(15,23,42,.18);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.5 Heebo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body.modal-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
a { color: var(--accent-fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 24px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
h2 { font-size: 15px; font-weight: 600; }
[hidden], .hide { display: none !important; }
.i { display: block; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.hint { font-size: 13px; color: var(--muted); }
.grow { flex: 1; min-width: 0; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

/* ---------- shell: mobile header + bottom nav, desktop sidebar */
.side { display: none; }
.mtop { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 4px; min-height: 56px; padding: env(safe-area-inset-top) 8px 0; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.mtop .brand { padding: 0 8px; }
.back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px 0 12px; border-radius: var(--r-sm); font-weight: 500; color: var(--accent-fg); }
.main { width: 100%; max-width: 1120px; margin: 0 auto; padding: 20px 16px calc(96px + env(safe-area-inset-bottom)); }
.mnav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr); background: color-mix(in srgb, var(--s1) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.mnav button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 56px; padding: 8px 0 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
.mnav [aria-current="page"] { color: var(--text); }
.mnav [aria-current="page"] .i { color: var(--accent-fg); }

.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 8px 10px; border-radius: 8px; color: var(--muted); font-weight: 500; }
.nav:hover { background: var(--s2); color: var(--text); }
.nav[aria-current="page"] { background: var(--s2); color: var(--text); }
.nav[aria-current="page"] .i { color: var(--accent-fg); }
.nav .dot { margin: 0 6px; }
.nav span:not(.dot) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-label { font-size: 12px; color: var(--faint); padding: 18px 10px 6px; }
.side-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 4px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--s3); display: grid; place-items: center; font-weight: 600; font-size: 13px; overflow: hidden; flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.who { flex: 1; min-width: 0; padding-inline-start: 6px; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (min-width: 900px) {
  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
  .side { display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 18px 12px 14px; background: var(--s1); border-inline-end: 1px solid var(--line); }
  .side .brand { padding: 2px 10px 16px; }
  .mtop, .mnav { display: none; }
  .main { padding: 36px 40px 64px; }
}

/* ---------- buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-sm); background: var(--s2); border: 1px solid var(--line); font-weight: 500; white-space: nowrap; text-decoration: none; color: var(--text); transition: background .15s, filter .15s; }
.btn:hover { background: var(--s3); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--danger); }
.btn.solid-danger { background: var(--danger); border-color: transparent; color: #fff; font-weight: 600; }
.btn.sm { padding: 0 12px; font-size: 14px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.ib { width: 44px; height: 44px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--muted); flex: none; transition: background .15s, color .15s; }
.ib:hover { background: var(--s2); color: var(--text); }
.ib[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-fg); }
.ib[disabled] { opacity: .35; pointer-events: none; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- page structure */
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 24px; }
.sub { color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sec { margin-top: 32px; }
.sec > h2, .col h2.out { margin-bottom: 12px; }
.card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); }
.pad { padding: 18px; }
.pad > h2 { margin-bottom: 14px; }
.list { overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.lrow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; width: 100%; min-height: 56px; padding: 12px 16px; }
button.lrow:hover { background: var(--s2); }
.lrow .em { width: 28px; flex: none; display: grid; place-items: center; font-size: 20px; color: var(--muted); }
.lrow .t { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.lrow .btns { display: flex; gap: 8px; margin-inline-start: auto; }
.lrow .glyph + .grow { flex-basis: 170px; }   /* lets the approve buttons wrap under the name on phones */
.empty { padding: 36px 20px; text-align: center; color: var(--muted); }
.empty .btnrow { justify-content: center; margin-top: 16px; }
.two { display: grid; gap: 32px; }
@media (min-width: 1040px) { .two { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }

/* ---------- status + device glyph */
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex: none; display: inline-block; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.dot.idle { background: var(--idle); }
.glyph { width: 40px; height: 40px; border-radius: var(--r-sm); display: grid; place-items: center; flex: none; background: var(--s2); border: 1px solid var(--line); color: color-mix(in srgb, var(--tv, var(--muted)) 72%, var(--text)); }
.glyph.lg { width: 52px; height: 52px; border-radius: 12px; }
.name { display: block; font-weight: 600; font-size: 16px; line-height: 1.3; }
.status { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }

/* ---------- overview device cards */
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.tvcard { display: flex; flex-direction: column; padding: 6px; }
.tvcard-head { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border-radius: var(--r-sm); }
.tvcard-head:hover { background: var(--s2); }
.tvcard-head > .i { color: var(--faint); }
.np { display: flex; align-items: center; gap: 10px; margin: 4px 10px 0; padding: 10px 12px; min-height: 54px; border-radius: var(--r-sm); background: var(--s2); font-size: 14px; }
.np .lbl { display: block; font-size: 12px; color: var(--muted); line-height: 1.2; }
.np b { font-weight: 600; }
.np .none { color: var(--muted); }
.appic { width: 32px; height: 32px; border-radius: 8px; flex: none; object-fit: cover; }
.appph { width: 32px; height: 32px; border-radius: 8px; flex: none; display: grid; place-items: center; background: var(--s3); color: var(--muted); font-weight: 600; font-size: 14px; }
.cmeta { font-size: 13px; color: var(--muted); padding: 10px 12px 2px; min-height: 30px; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line); }
.quick .ib { width: 100%; }

/* ---------- TV page */
.cols { display: grid; gap: 16px; align-items: start; }
.col { display: grid; gap: 16px; min-width: 0; }
@media (min-width: 1180px) { .cols { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } }
.nowcard { position: relative; overflow: hidden; padding: 22px 20px 18px; }
.nowcard::before { content: ""; position: absolute; top: 0; bottom: 0; inset-inline-start: 0; width: 3px; background: var(--tv); }
.now { display: flex; align-items: center; gap: 16px; }
.now .appic, .now .appph { width: 64px; height: 64px; border-radius: 16px; font-size: 24px; }
.now .lbl { font-size: 13px; color: var(--muted); }
.now .ttl { font-size: 26px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
.now .ttl.quiet { font-size: 20px; font-weight: 600; color: var(--muted); }
.vol { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
.vol input { flex: 1; min-width: 0; height: 44px; accent-color: var(--accent); margin: 0; }
.vol .num { min-width: 3ch; text-align: center; font-weight: 600; font-size: 17px; }
.ctrls { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.ctrl { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 66px; padding: 10px 4px; border-radius: var(--r-sm); background: var(--s2); font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.2; }
.ctrl .i { color: var(--text); }
.ctrl:hover { background: var(--s3); }
.ctrl[disabled] { opacity: .4; pointer-events: none; }
@media (max-width: 560px) { .ctrls { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 4px 0 12px; }
.setrow b { display: block; font-weight: 500; }
.divider { height: 1px; background: var(--line); margin: 18px 0 14px; }
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 4px; }
.app { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: var(--r-sm); font-size: 12.5px; line-height: 1.25; color: var(--muted); text-align: center; overflow-wrap: anywhere; }
.app:hover { background: var(--s2); color: var(--text); }
.app .appic, .app .appph { width: 44px; height: 44px; border-radius: 10px; font-size: 17px; }
.app[disabled] { opacity: .45; pointer-events: none; }

/* ---------- form controls */
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
.inp { width: 100%; min-width: 0; min-height: 44px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); color: var(--text); font-size: 15px; }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.inp { min-height: 88px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--s3); border: 1px solid var(--line); transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); border-color: transparent; }
.switch input:checked + span::after { transform: translateX(-18px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 99px; background: var(--s2); border: 1px solid var(--line); font-size: 14px; }
.chip:hover { background: var(--s3); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chip[disabled] { opacity: .45; pointer-events: none; }
.swatches { display: flex; flex-wrap: wrap; gap: 2px; }
.sw { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
.sw::after { content: ""; width: 28px; height: 28px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.sw[aria-pressed="true"]::after { box-shadow: 0 0 0 2px var(--s1), 0 0 0 4px var(--text); }
.emojis { display: flex; flex-wrap: wrap; gap: 2px; }
.emojis button { width: 44px; height: 44px; border-radius: var(--r-sm); font-size: 22px; display: grid; place-items: center; }
.emojis button:hover { background: var(--s2); }
.emojis [aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.drop { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; padding: 12px; border: 1px dashed var(--line); border-radius: var(--r-sm); color: var(--muted); cursor: pointer; text-align: center; }
.drop:hover { border-color: var(--muted); }
.drop:focus-within, label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.drop img { max-width: 100%; max-height: 180px; border-radius: 8px; display: block; }
label.btn { position: relative; cursor: pointer; }

/* ---------- notes */
.screens { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: -12px 0 20px; font-size: 13px; color: var(--muted); }
.nrow { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; padding: 10px 10px 10px 12px; }
.nrow .bar { align-self: stretch; border-radius: 2px; background: var(--c); }
.nmain { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 6px; border-radius: var(--r-sm); }
.nmain:hover { background: var(--s2); }
.nemo { width: 30px; flex: none; text-align: center; font-size: 22px; }
.nmain .grow > span { display: block; }
.ntitle { font-weight: 600; }
.ntext { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nmeta { display: flex !important; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.thumbbox { width: 48px; height: 48px; flex: none; border-radius: 8px; background: var(--s2); display: grid; place-items: center; color: var(--faint); overflow: hidden; }
.thumbbox img { width: 100%; height: 100%; object-fit: cover; }
.nacts { display: flex; }
@media (max-width: 640px) {
  .nrow { grid-template-columns: 4px minmax(0, 1fr); }
  .nrow .bar { grid-row: span 2; }
  .nacts { justify-content: flex-end; margin-top: -4px; }
}
.ned { display: grid; gap: 20px; }
.ned-form { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.ned-prev { display: flex; flex-direction: column; gap: 8px; }
@media (min-width: 760px) { .ned { grid-template-columns: minmax(0, 1fr) 260px; align-items: start; } .ned-prev { position: sticky; top: 0; } }
.paper { background: var(--c); color: #1d1a12; border-radius: 12px; padding: 18px; min-height: 150px; box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.22); overflow-wrap: anywhere; }
.paper .pt { font-weight: 700; font-size: 20px; line-height: 1.3; }
.paper p { margin-top: 6px; white-space: pre-wrap; font-size: 15px; }
.paper img { display: block; width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; margin-top: 12px; }
.paper .ph { color: rgba(0,0,0,.4); }
.emorow { display: flex; gap: 8px; align-items: flex-start; }
.emorow .inp { width: 60px; flex: none; text-align: center; font-size: 20px; padding: 6px; }

/* ---------- sheet: bottom sheet on mobile, dialog on desktop */
.scrim { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(5,8,12,.56); }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column; background: var(--s1); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; box-shadow: var(--pop); }
.sheet.wide { max-width: 860px; }
.sh-head { display: flex; align-items: center; gap: 12px; padding: 12px 20px 4px 10px; }
.sh-head h2 { flex: 1; font-size: 18px; line-height: 1.35; }
.sh-body { overflow: auto; padding: 8px 20px 18px; display: flex; flex-direction: column; gap: 16px; }
.sh-body:empty { display: none; }
.sh-foot { display: flex; gap: 10px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.sh-foot .btn:first-child { flex: 1; }
@media (min-width: 700px) {
  .scrim { align-items: center; padding: 24px; }
  .sheet { border-radius: 16px; border-bottom: 1px solid var(--line); }
  .sh-foot { padding-bottom: 14px; }
}

/* ---------- login + toast */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.login .card { width: 100%; max-width: 380px; padding: 36px 28px 28px; text-align: center; }
.login .mark { width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 18px; }
.login h1 { margin-bottom: 4px; }
.login .btn { width: 100%; margin-top: 24px; }
.login .err { color: var(--danger); margin-top: 16px; font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 60; display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 32px); padding: 11px 16px; border-radius: var(--r-sm); background: var(--text); color: var(--bg); font-weight: 500; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.toast.err .i { color: var(--danger); }
@media (min-width: 900px) { .toast { bottom: 28px; } }

@media (prefers-reduced-motion: no-preference) {
  .scrim { animation: fade .18s ease-out; }
  .sheet { animation: rise .24s cubic-bezier(.2,.8,.2,1); }
  .toast { animation: fade .18s ease-out; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

// ===== helpers on device data
const isScreen = t => t?.info?.kind === "screen";
const approved = () => Object.entries(tvs).filter(([, t]) => t.meta?.approved && !isScreen(t))
  .sort((a, b) => (a[1].meta.order ?? 9) - (b[1].meta.order ?? 9));
const pending = () => Object.entries(tvs).filter(([, t]) => !t.meta?.approved && t.info);
const screens = () => Object.entries(tvs).filter(([, t]) => t.meta?.approved && isScreen(t));
const isTv = uid => !!tvs[uid]?.meta?.approved && !isScreen(tvs[uid]);
function stateOf(t) {
  const s = t.status || {};
  const online = s.lastSeen && Date.now() - s.lastSeen < ONLINE_MS;
  if (!online) return { cls: "", text: "לא מחוברת", online: false };
  if (!s.screenOn) return { cls: "idle", text: "מסך כבוי", online: true };
  return { cls: "on", text: "דולקת", online: true };
}
const iconOf = (t, pkg) => { const b = pkg && t.icons?.[pkg.replaceAll(".", "_")]; return b ? `data:image/png;base64,${b}` : ""; };
const appIcon = (t, pkg, label) => { const ic = iconOf(t, pkg); return ic ? `<img class="appic" src="${ic}" alt="">` : `<span class="appph" aria-hidden="true">${esc((label || "?").trim()[0])}</span>`; };
function ago(ts) {
  if (!ts) return "";
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "עכשיו"; if (m < 60) return `לפני ${m} דק׳`;
  const h = Math.round(m / 60); if (h < 24) return `לפני ${h} שע׳`;
  return new Date(ts).toLocaleDateString("he-IL");
}
const tvColor = t => t.meta?.color || TV_COLORS[0];
const tvName = t => t.meta?.name || t.info?.model || "טלוויזיה";

// ===== commands
async function cmd(uid, type, args = {}, quiet) {
  if (DEMO) return quiet || toast(`${tvName(tvs[uid])}: בוצע`, "ok");
  const id = newKey();
  await put(`tvs/${uid}/in/cmd`, { id, type, ...args, ts: Date.now() });
  if (!quiet) waitAck(uid, id);
}
function waitAck(uid, id) {
  let done = false;
  const off = fb.onValue(fb.ref(db, `tvs/${uid}/ack`), s => {
    const a = s.val();
    if (a?.id !== id) return;
    done = true; off();
    toast(a.ok ? `${tvName(tvs[uid])}: בוצע` : `${tvName(tvs[uid])}: ${a.error}`, a.ok ? "ok" : "err");
  });
  setTimeout(() => { if (!done) { off(); toast(`${tvName(tvs[uid])} לא ענתה. אולי היא כבויה?`, "err"); } }, 15000);
}
const setConfig = (uid, path, value) => put(`tvs/${uid}/in/config/${path}`, value);
const log = entry => put(`log/${newKey()}`, { at: stamp(), by: user.displayName || user.email, ...entry });

}

function tvCard(uid, t) {
  const st = stateOf(t), s = t.status || {}, cfg = t.in?.config || {}, lockOn = !!cfg.lock?.on, off = st.online ? "" : "disabled";

  if (s.locked || lockOn) meta.push("נעולה");
  if (s.bedtimeNow) meta.push("בשעת שינה"); else if (cfg.bedtime?.on) meta.push(`שינה ב-${esc(cfg.bedtime.from || "21:00")}`);
  return `
  <article class="card tvcard" style="--tv:${esc(tvColor(t))}">
    <button class="tvcard-head" data-tab="${uid}">
      <span class="glyph">${icon("tv")}</span>
      <span class="grow"><span class="name">${esc(tvName(t))}</span>

const pad2 = n => String(n).padStart(2, "0");
const ymd = (y, m, d) => `${y}-${pad2(m)}-${pad2(d)}`;
const todayYmd = () => { const d = new Date(); return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
/** "3.11.2026", "03/11/26", "3.11" or "2026-11-3" -> "2026-11-03"; anything else -> "". */
function normDate(s) {
  s = String(s || "").trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return ymd(m[1], m[2], m[3]);
  if ((m = s.match(/^(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2,4}))?$/))) {
    let y = +(m[3] || new Date().getFullYear()); if (y < 100) y += 2000;
    return ymd(y, m[2], m[1]);
  }
  return "";
}
const shortDay = s => { const [, m, d] = s.split("-"); return `${+d}.${+m}`; };
const paperHex = c => { c = String(c || "").trim(); return PAPER_NAMES[c] || (/^#[0-9a-f]{3,8}$/i.test(c) ? c.toLowerCase() : PAPER[0][1]); };

function noteState(n) {

  const range = from && to ? `${shortDay(from)}–${shortDay(to)}` : to ? `עד ${shortDay(to)}` : from ? `מ-${shortDay(from)}` : "";
  const state = from && from > t ? ["", "עוד לא מוצג"] : to && to < t ? ["", "פג תוקף"] : ["on", "מוצג עכשיו"];
  return { cls: state[0], text: state[1], range };
}

async function importSheet() {
  try {
    const csv = await fetch(SHEET_CSV()).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
    const rows = parseCsv(csv).slice(1).map(r => r.map(x => (x || "").trim())).filter(r => r[1] || r[2] || r[3]);
    if (!rows.length) return toast("לא נמצאו פתקים בגיליון", "err");
    const out = {};
    rows.forEach((r, i) => out[newKey()] = { emoji: r[0] || "", title: r[1] || "", text: r[2] || "", image: validImage(r[3]),
      color: paperHex(r[4]), from: normDate(r[5]), to: normDate(r[6]), order: i });
    await patch("notes", out);
    toast(`יובאו ${rows.length} פתקים`, "ok");
  } catch { toast("לא הצלחתי לקרוא את הגיליון", "err"); }
}

function parseCsv(t) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; } else if (c !== "\r") f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}

const imgCache = {};
function imageSrc(v) {
  v = (v || "").trim();
  if (/^img:[\w-]+$/.test(v)) {
    const id = v.slice(4);
    if (DEMO) return Promise.resolve(demoDb.images[id]?.data || "");
    return imgCache[id] ??= fetch(`${firebaseConfig.databaseURL}/images/${id}.json`).then(r => r.json()).then(x => x?.data || "").catch(() => "");
  }
  // Google Photos share links are pages, not images; only the TV app can resolve them
  return Promise.resolve(/^https?:\/\//.test(v) && !/photos\.app\.goo\.gl|photos\.google/.test(v) ? v : "");
}
function fillImgs(root) {
  root.querySelectorAll("[data-img]").forEach(async el => {
    const src = await imageSrc(el.dataset.img);
    if (src && el.isConnected) el.innerHTML = `<img src="${esc(src)}" alt="">`;
  });
}
function shrink(file, max = 1100, q = .78) {
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      ok(c.toDataURL("image/jpeg", q));
    };
    img.onerror = bad;
    img.src = URL.createObjectURL(file);
  });
}
async function uploadImage(dataUrl) {
  const key = newKey();
  await put(`images/${key}`, { data: dataUrl, at: stamp() });
  return key;
}

    <div class="setrow" style="padding:0"><span>עם צליל</span><label class="switch"><input type="checkbox" id="msnd" checked aria-label="עם צליל"><span></span></label></div>`,
    `<button class="btn primary" id="msend">${icon("send", 18)}שליחה</button><button class="btn" data-close>ביטול</button>`);
  $("#targets").onclick = e => { const b = e.target.closest("[data-u]"); if (!b) return; const u = b.dataset.u;
    chosen.has(u) ? chosen.delete(u) : chosen.add(u); b.setAttribute("aria-pressed", chosen.has(u)); };
  $("#emo").onclick = e => { const b = e.target.closest("[data-e]"); if (!b) return; emoji = emoji === b.dataset.e ? "" : b.dataset.e;
    $("#emo").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x.dataset.e === emoji)); };
  $("#mfile").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    image = await shrink(f, 900, .75);
    $("#mprev").innerHTML = `<img src="${image}" alt="">`;
  };
  $("#msend").onclick = async () => {
    const text = $("#mtext").value.trim();
    if (!text && !image) return toast("צריך לכתוב משהו או להוסיף תמונה", "err");
    if (!chosen.size) return toast("צריך לבחור לפחות טלוויזיה אחת", "err");
    $("#msend").disabled = true; $("#msend").textContent = "שולח…";
    try {
      const imgRef = image ? "img:" + await uploadImage(image) : "";
      const args = { text, emoji, image: imgRef, seconds: +$("#msec").value, position: $("#mpos").value, sound: $("#msnd").checked, from: firstName() };
      await Promise.all([...chosen].map(u => cmd(u, "message", args)));
      log({ type: "message", emoji, text, image: !!imgRef, to: [...chosen].map(u => tvName(tvs[u])).join(", ") });
      close(); toast("ההודעה נשלחה", "ok");
    } catch { toast("השליחה נכשלה", "err"); $("#msend").disabled = false; $("#msend").textContent = "שליחה"; }
  };
}

function openApprove(uid) {
  const t = tvs[uid], screen = isScreen(t);
  let color = TV_COLORS[approved().length % TV_COLORS.length];
  const close = openSheet(screen ? "אישור מסך" : "טלוויזיה חדשה", `
    <p class="hint">${screen ? "אחרי האישור המסך יוכל לקרוא את הפתקים." : `${esc(t.info.model)} · IP ${esc(t.info.ip)}`}</p>
    <label class="field">שם<input class="inp" id="aname" data-focus value="${screen ? esc(t.info.model || "") : ""}" placeholder="${screen ? "" : "למשל: הסלון, החדר של רועי"}"></label>
    ${screen ? "" : `<div class="field">צבע<div class="swatches" id="acolor">${TV_COLORS.map(c => swatch(c, c === color, `data-c="${c}"`)).join("")}</div></div>`}`,
    `<button class="btn primary" id="aok">${screen ? "אישור" : "הוספה לשלט"}</button><button class="btn" data-close>ביטול</button>`);
  if (!screen) $("#acolor").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; color = b.dataset.c; pressOne($("#acolor"), b); };
  $("#aok").onclick = async () => {
    const name = $("#aname").value.trim(); if (!name) return toast("צריך לתת שם", "err");
    await put(`tvs/${uid}/meta`, screen ? { approved: true, name } : { approved: true, name, color, order: approved().length });
    close(); toast(`${name} נוספה`, "ok");
  };
}

function askUrl(uid) {
  const close = openSheet("פתיחת אתר בטלוויזיה", `
    <div class="chips" id="usites">${[["ONE", "https://www.one.co.il/"], ["ספורט 5", "https://www.sport5.co.il/"], ["ynet", "https://www.ynet.co.il/"], ["N12", "https://www.mako.co.il/news"]]
      .map(([n, u]) => `<button class="chip" data-u="${u}">${n}</button>`).join("")}</div>
    <label class="field">כתובת<input class="inp" id="uurl" placeholder="https://" dir="ltr" inputmode="url" data-focus></label>`,
    `<button class="btn primary" id="uok">פתיחה</button><button class="btn" data-close>ביטול</button>`);
  $("#usites").onclick = e => { const b = e.target.closest("[data-u]"); if (b) $("#uurl").value = b.dataset.u; };
  $("#uok").onclick = () => { let u = $("#uurl").value.trim(); if (!u) return; if (!/^https?:\/\//.test(u)) u = "https://" + u; cmd(uid, "url", { url: u }); close(); };
}

function openNote(id) {
  const src = id ? notes[id] : {};
  const n = { emoji: "📌", title: "", text: "", image: "", ...src };
  n.color = paperHex(n.color); n.from = normDate(n.from); n.to = normDate(n.to);
  let pick = "";   // a freshly chosen photo (data URL); uploaded only on save
  const close = openSheet(id ? "עריכת פתק" : "פתק חדש", `<div class="ned">
    <div class="ned-form">
      <div class="field">אימוג׳י<div class="emorow"><input class="inp" id="ne" value="${esc(n.emoji)}" maxlength="8" aria-label="אימוג׳י">
        <div class="emojis" id="neq">${NOTE_EMOJIS.map(e => `<button data-e="${e}" aria-label="${e}">${e}</button>`).join("")}</div></div></div>
      <label class="field">כותרת<input class="inp" id="nt" value="${esc(n.title)}" maxlength="60" data-focus></label>
      <label class="field">טקסט<textarea class="inp" id="nx" maxlength="300">${esc(n.text)}</textarea></label>
      <div class="field">תמונה
        <div class="btnrow"><label class="btn sm"><input type="file" accept="image/*" id="nf" class="vh">${icon("upload", 18)}העלאת תמונה</label>
          <button class="btn sm danger" id="nrm">${icon("trash", 18)}הסרה</button></div>
        <input class="inp" id="nu" dir="ltr" inputmode="url" placeholder="או קישור לתמונה: https://…" value="${/^https?:/.test(n.image) ? esc(n.image) : ""}" aria-label="קישור לתמונה">
      </div>
      <div class="field">צבע הפתק<div class="swatches" id="nc">${PAPER.map(([name, c]) => swatch(c, c === n.color, `data-c="${c}"`, name)).join("")}</div></div>
      <div class="grid2">
        <label class="field">מתאריך<input type="date" class="inp" id="nfrom" value="${esc(n.from)}"></label>
        <label class="field">עד תאריך<input type="date" class="inp" id="nto" value="${esc(n.to)}"></label>
      </div>
      <p class="hint" style="margin-top:-8px">בלי תאריכים הפתק מוצג תמיד.</p>
    </div>
    <div class="ned-prev"><span class="hint">כך זה ייראה בסלון</span><div class="paper" id="np"></div></div>
  </div>`, `<button class="btn primary" id="nsave">${icon("check", 18)}שמירה</button><button class="btn" data-close>ביטול</button>`, { wide: true });
  const preview = async () => {
    const img = pick || await imageSrc(n.image), box = $("#np");
    if (!box) return;
    box.style.setProperty("--c", n.color);
    box.innerHTML = n.title || n.text || n.emoji || img
      ? `<div class="pt">${esc(n.emoji)} ${esc(n.title)}</div>${n.text ? `<p>${esc(n.text)}</p>` : ""}${img ? `<img src="${esc(img)}" alt="">` : ""}`
      : `<span class="ph">הפתק ריק</span>`;
    $("#nrm").hidden = !(pick || n.image);
  };
  preview();
  $("#modal").oninput = e => {
    const k = { ne: "emoji", nt: "title", nx: "text", nfrom: "from", nto: "to" }[e.target.id];
    if (k) n[k] = e.target.value;
    if (e.target.id === "nu") { n.image = e.target.value.trim(); pick = ""; }
    preview();
  };
  $("#neq").onclick = e => { const b = e.target.closest("[data-e]"); if (!b) return; n.emoji = $("#ne").value = b.dataset.e; preview(); };
  $("#nc").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; n.color = b.dataset.c; pressOne($("#nc"), b); preview(); };
  $("#nf").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { pick = await shrink(f, 1100, .78); $("#nu").value = ""; preview(); } catch { toast("לא הצלחתי לפתוח את התמונה", "err"); }
  };
  $("#nrm").onclick = () => { pick = ""; n.image = ""; $("#nu").value = ""; preview(); };
  $("#nsave").onclick = async () => {
    const title = n.title.trim(), text = n.text.trim();
    if (!title && !text && !pick && !validImage(n.image)) return toast("צריך כותרת, טקסט או תמונה", "err");
    if (n.from && n.to && n.from > n.to) return toast("תאריך הסיום לפני תאריך ההתחלה", "err");
    const b = $("#nsave"); b.disabled = true; b.textContent = "שומר…";
    try {
      const image = pick ? "img:" + await uploadImage(pick) : validImage(n.image);
      const order = id ? (src.order ?? 0) : Math.max(-1, ...Object.values(notes).map(x => +x.order || 0)) + 1;
      await put(`notes/${id || newKey()}`, { emoji: n.emoji.trim(), title, text, image, color: n.color, from: n.from, to: n.to, order });
      close(); toast("הפתק נשמר", "ok");
    } catch { toast("השמירה נכשלה", "err"); b.disabled = false; b.textContent = "שמירה"; }
  };
}

/** In-page yes/no sheet (browser confirm() dialogs look bad and block the page). */
function ask(text, yes) {
  return new Promise(ok => {
    let v = false;
    const close = openSheet(esc(text), "", `<button class="btn solid-danger" id="qyes">${esc(yes)}</button><button class="btn" data-close data-focus>ביטול</button>`, { onClose: () => ok(v) });
    $("#qyes").onclick = () => { v = true; close(); };
  });
}

// ===== one delegated click handler for everything outside sheets
document.addEventListener("click", async e => {
  if (e.target.closest("#modal")) return;
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { current = tabBtn.dataset.tab; ls.set("tab", current); render(); scrollTo({ top: 0 }); return; }
  const b = e.target.closest("[data-do]"); if (!b || b.disabled) return;
  const uid = b.dataset.uid, t = tvs[uid], d = b.dataset.do;
  switch (d) {
    case "login": return fb.signInWithPopup(auth, new fb.GoogleAuthProvider()).catch(e => toast("הכניסה נכשלה: " + e.code, "err"));
    case "logout": return DEMO ? toast("במצב הדגמה אין יציאה") : fb.signOut(auth);
    case "theme": {
      const order = ["", "light", "dark"], next = order[(order.indexOf(ls.get("theme") || "") + 1) % 3];
      ls.set("theme", next || null); applyTheme(); render();
      return toast("ערכת צבעים: " + THEMES[next][1]);
    }
    case "msg": return openComposer(uid);
    case "tmpl": return openComposer("*", TEMPLATES[+b.dataset.i]);
    case "quick": {
      const m = TEMPLATES[+b.dataset.i];
      await Promise.all(approved().map(([u]) => cmd(u, "message", { ...m, seconds: 30, sound: true, from: firstName() }, true)));
      log({ type: "message", ...m, to: "כל הבית" }); return toast("נשלח לכל הבית", "ok");
    }
    case "lock": {
      const on = !t.in?.config?.lock?.on;
      await setConfig(uid, "lock/on", on); if (on && !t.in?.config?.lock?.text) await setConfig(uid, "lock/text", "המסך נעול 🔒");
      log({ type: "lock", emoji: on ? "🔒" : "🔓", text: on ? "נעילה" : "שחרור נעילה", to: tvName(t) });
      return toast(on ? `${tvName(t)} ננעלה` : `${tvName(t)} שוחררה`, "ok");
    }
    case "lockall": case "unlockall": {
      const on = d === "lockall";
      await Promise.all(approved().map(([u]) => setConfig(u, "lock/on", on)));
      log({ type: "lock", emoji: on ? "🔒" : "🔓", text: on ? "נעילת כל הבית" : "שחרור כל הבית", to: "כל הבית" });
      return toast(on ? "כל הטלוויזיות ננעלו" : "כל הטלוויזיות שוחררו", "ok");
    }
    case "mute": return cmd(uid, "mute", { on: !t.status?.muted });
    case "home": case "pause": case "play": case "screenOff": case "screenOn": case "refresh": return cmd(uid, d);
    case "open": return cmd(uid, "open", { pkg: b.dataset.pkg });
    case "hdmi": return cmd(uid, "hdmi", { input: b.dataset.input });
    case "url": return askUrl(uid);
    case "style": return sendStyle(uid, b.dataset.k, b.dataset.k === "size" ? +b.dataset.v : b.dataset.v);
    case "skip": {
      const min = +b.dataset.min;
      await setConfig(uid, "bedtime/skipUntil", min ? Date.now() + min * 60000 : 0);
      if (min) log({ type: "bedtime", emoji: "⏰", text: `שעת שינה נדחתה ב-${min} דק׳`, to: tvName(t) });
      return toast(min ? `פתוח לעוד ${min} דקות` : "ההארכה בוטלה", "ok");
    }
    case "meta": return patch(`tvs/${uid}/meta`, { [b.dataset.k]: b.dataset.v });
    case "approve": return openApprove(uid);
    case "reject": if (await ask("למחוק את המכשיר הזה מהרשימה?", "מחיקה")) await del(`tvs/${uid}`); return;
    case "forget":
      if (await ask(`להסיר את "${tvName(t)}" מהשלט? היא תחזור לרשימת האישור אם האפליקציה עדיין מותקנת.`, "הסרה")) { await del(`tvs/${uid}/meta`); current = "home"; render(); }
      return;
    case "noteNew": return openNote();
    case "noteEdit": return openNote(b.dataset.id);
    case "noteDel": {
      const n = notes[b.dataset.id];
      if (await ask(`למחוק את הפתק "${n?.title || n?.text?.slice(0, 30) || ""}"?`, "מחיקה")) { await del(`notes/${b.dataset.id}`); toast("הפתק נמחק", "ok"); }
      return;
    }
    case "noteUp": case "noteDown": {
      const list = sortedNotes(), i = list.findIndex(([k]) => k === b.dataset.id), j = i + (d === "noteUp" ? -1 : 1);
      if (i < 0 || j < 0 || j >= list.length) return;
      [list[i], list[j]] = [list[j], list[i]];
      await patch("notes", Object.fromEntries(list.map(([k], n) => [`${k}/order`, n])));
      $(`[data-do="${d}"][data-id="${b.dataset.id}"]:not([disabled])`)?.focus();   // keep keyboard position after re-render
      return;
    }
    case "import": b.disabled = true; await importSheet(); b.disabled = false; return;
  }
});

// switches + text fields (config): saved on change
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.closest("#modal")) return;
  if (el.id === "vol") return cmd(current, "volume", { level: +el.value });
  if (el.dataset.wp) {
    const f = el.files[0]; el.value = ""; if (!f) return;
    toast("מעלה את התמונה…");
    try { await sendStyle(el.dataset.wp, "bg", DEMO ? "demo1" : await uploadImage(await shrink(f, 1600, .85))); }
    catch { toast("ההעלאה נכשלה", "err"); }
    return;
  }
  if (el.dataset.cfg) {
    const uid = el.dataset.uid, t = tvs[uid];
    await setConfig(uid, `${el.dataset.cfg}/on`, el.checked);
    if (el.dataset.cfg === "bedtime" && el.checked && !t.in?.config?.bedtime?.from)
      await patch(`tvs/${uid}/in/config/bedtime`, { from: "21:00", to: "07:00" });
    log({ type: el.dataset.cfg, emoji: el.dataset.cfg === "lock" ? (el.checked ? "🔒" : "🔓") : "🌙",
      text: el.dataset.cfg === "lock" ? (el.checked ? "נעילה" : "שחרור נעילה") : (el.checked ? "שעת שינה הופעלה" : "שעת שינה כובתה"), to: tvName(t) });
    return toast("נשמר", "ok");
  }
  if (el.dataset.cfgtext) { await setConfig(el.dataset.uid, el.dataset.cfgtext, el.value); return toast("נשמר", "ok"); }
  if (el.dataset.meta) { await patch(`tvs/${el.dataset.uid}/meta`, { [el.dataset.meta]: el.value.trim() }); return toast("נשמר", "ok"); }
});
document.addEventListener("input", e => { if (e.target.id === "vol") $("#volnum").textContent = e.target.value; });

let toastTimer;
function toast(text, kind) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast" + (kind === "err" ? " err" : ""); el.setAttribute("role", "status");
  el.innerHTML = (kind ? icon(kind === "err" ? "alert" : "check", 18) : "") + `<span>${esc(text)}</span>`;
  document.body.appendChild(el); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 3200);
}
// refresh "x minutes ago" and online dots
setInterval(() => { if (user && !$("#modal").innerHTML) render(); }, 30000);
